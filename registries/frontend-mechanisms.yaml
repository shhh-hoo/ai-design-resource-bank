version: 1
purpose: >-
  Human-facing reusable frontend mechanisms. Each entry names an interaction or explanatory
  pattern, the task it solves, a small live demo key, and mature tools worth checking before
  implementing it in production.

chapters:
  - id: math
    label: Mathematics
    blurb: Turn abstract relationships into objects that can be manipulated.
  - id: physics
    label: Physics
    blurb: Keep state, force, motion, and time visible in the same explanation.
  - id: chemistry
    label: Chemistry
    blurb: Show change without losing the chemical meaning carried by structure and space.
  - id: animation
    label: Motion
    blurb: Use movement to establish sequence, hierarchy, and comparison—not decoration.
  - id: stage
    label: Stage & camera
    blurb: Direct attention by moving the viewpoint, framing, or light instead of adding more interface.
  - id: typography
    label: Typography
    blurb: Let type reveal structure and emphasis without turning reading into an effect demo.
  - id: rendering
    label: Rendering & particles
    blurb: Use depth, fields, noise, and particles when the visual mechanism needs more than ordinary DOM motion.
  - id: spatial-3d
    label: 3D explanation
    blurb: Keep identity, orientation, and annotation stable while objects move through space.
  - id: graphs
    label: Graphs & space
    blurb: Preserve orientation while revealing structure, focus, and scale.

mechanisms:
  - id: movable-tangent
    name: Movable tangent
    domain: math
    summary: Drag a point along a curve to connect local slope with the derivative.
    use_when: Teaching rate of change, gradient, local linearity, or derivative intuition.
    tools: [mafs, jsxgraph]
    demo: movable-tangent
    primitives: [function-plot, draggable-point, tangent-line, slope-readout]
    implementation_note: Keep the point, tangent, and numeric slope synchronized from one parameter value.
    status: seed

  - id: area-under-curve
    name: Area under a curve
    domain: math
    summary: Move a boundary and watch accumulated area grow with it.
    use_when: Teaching integration, accumulation, displacement from velocity, or probability area.
    tools: [mafs, jsxgraph, d3]
    demo: area-under-curve
    primitives: [function-plot, variable-boundary, area-fill, accumulator]
    implementation_note: Make the moving boundary the single source of truth for both geometry and the displayed value.
    status: seed

  - id: vector-decomposition
    name: Vector decomposition
    domain: math
    summary: Drag one vector and keep its horizontal and vertical components attached.
    use_when: Teaching components, resultant vectors, forces, velocity, or coordinate projections.
    tools: [mafs, jsxgraph]
    demo: vector-decomposition
    primitives: [draggable-vector, component-arrows, projections, labels]
    implementation_note: Preserve geometric dependency so the components cannot drift from the parent vector.
    status: seed

  - id: force-vector-overlay
    name: Force vector overlay
    domain: physics
    summary: Put forces directly on the object whose motion they explain.
    use_when: Showing free-body ideas without separating the diagram from the moving system.
    tools: [matter-js]
    demo: force-vector-overlay
    primitives: [body, force-arrows, direction, magnitude]
    implementation_note: Derive arrow direction and length from the same state used by the simulation.
    status: seed

  - id: wave-propagation
    name: Wave propagation
    domain: physics
    summary: Animate phase through space while keeping amplitude and wavelength legible.
    use_when: Teaching waves, phase, wavelength, frequency, interference, or oscillation.
    tools: [p5js]
    demo: wave-propagation
    primitives: [wave-path, phase, amplitude-control, wavelength-control]
    implementation_note: Animate phase rather than translating a static curve; controls should change the model, not only the drawing.
    status: seed

  - id: reaction-coordinate
    name: Reaction coordinate
    domain: chemistry
    summary: Scrub from reactants through the transition state to products on one energy path.
    use_when: Connecting activation energy, transition state, exothermicity, and reaction progress.
    tools: [plotly-js, d3]
    demo: reaction-coordinate
    primitives: [energy-curve, scrubber, state-marker, energy-difference]
    implementation_note: Keep the progress marker and chemical-state annotation tied to the same normalized reaction coordinate.
    status: seed

  - id: orbital-overlap
    name: Orbital overlap
    domain: chemistry
    summary: Move orbitals together and make overlap appear as a spatial relationship.
    use_when: Explaining bond formation, sigma/pi overlap, or qualitative orbital interaction.
    tools: [threejs]
    demo: orbital-overlap
    primitives: [lobes, separation-control, overlap-region, phase]
    implementation_note: Use color only to distinguish phase or overlap; geometry should carry the primary explanation.
    status: seed

  - id: electron-pushing
    name: Electron pushing
    domain: chemistry
    summary: Animate a curved arrow as a state change, not as decoration on a static scheme.
    use_when: Teaching reaction mechanisms, electron pairs, bond making, or bond breaking.
    tools: [svgjs, motion]
    demo: electron-pushing
    primitives: [curved-arrow, electron-source, destination, before-after-state]
    implementation_note: The arrow should trigger a deterministic structure change so the causal relation stays explicit.
    status: seed

  - id: bond-morph
    name: Bond morph
    domain: chemistry
    summary: Show one bond weakening as another forms so structure change reads as one continuous event.
    use_when: Explaining substitution, addition, elimination, resonance changes, or concerted bond-making and bond-breaking.
    tools: [svgjs, motion, rdkit-js]
    demo: bond-morph
    primitives: [bond-state, bond-opacity, atom-identity, reaction-progress]
    implementation_note: Preserve atom identity while bond state changes; do not morph whole structures so aggressively that correspondence is lost.
    status: seed

  - id: mask-transition
    name: Mask transition
    domain: animation
    summary: Reveal the next state through a controlled moving window instead of cross-fading everything.
    use_when: Comparing two states, scene changes, before/after explanations, or editorial transitions.
    tools: [motion, gsap]
    demo: mask-transition
    primitives: [mask, reveal-progress, foreground, background]
    implementation_note: Keep the mask geometry simple enough that the transition reads before the ornament does.
    status: seed

  - id: pinned-reveal
    name: Pinned reveal
    domain: animation
    summary: Hold one explanatory object steady while the surrounding narrative advances.
    use_when: Scrollytelling, stage-like sequencing, progressive diagrams, or chapter transitions.
    tools: [gsap, motion]
    demo: pinned-reveal
    primitives: [sticky-stage, progress, narrative-steps, state-switch]
    implementation_note: Pin only the explanatory anchor; let the text continue to establish temporal progress.
    status: seed

  - id: scroll-scrub
    name: Scroll-scrub timeline
    domain: animation
    summary: Map scroll position to one deterministic playhead instead of firing disconnected enter animations.
    use_when: Scrollytelling, product walkthroughs, progressive diagrams, or sequences where users should be able to move backward as naturally as forward.
    tools: [gsap, motion]
    demo: scroll-scrub
    primitives: [scroll-progress, playhead, reversible-state, progress-indicator]
    implementation_note: Make scroll position the source of truth; derived visual states should be reversible at any point in the timeline.
    status: seed
    references:
      - https://gsap.com/docs/v3/Plugins/ScrollTrigger/
      - https://motion.dev/examples?category=scroll

  - id: camera-dolly
    name: Camera dolly
    domain: stage
    summary: Move the viewpoint through depth so foreground and background change relationship, not just size.
    use_when: Stage-like scene changes, 3D storytelling, product reveals, or teaching spatial relationships where perspective matters.
    tools: [threejs, theatrejs]
    demo: camera-dolly
    primitives: [camera-position, focal-target, foreground, background, depth-cue]
    implementation_note: Keep a stable focal target and distinguish camera translation from simply scaling the scene.
    status: seed

  - id: stage-spotlight
    name: Stage spotlight
    domain: stage
    summary: Move one pool of attention across a scene while everything else remains present.
    use_when: Presentations, stage metaphors, diagram walkthroughs, or interfaces where attention should move without hiding context.
    tools: [gsap, motion, svgjs]
    demo: stage-spotlight
    primitives: [attention-window, stage, target, context]
    implementation_note: Use light or contrast to redirect attention; avoid turning every target into a separate card or modal.
    status: seed

  - id: split-text-reveal
    name: Split-text reveal
    domain: typography
    summary: Reveal words or lines in reading order so motion reinforces phrasing instead of fragmenting it.
    use_when: Editorial headlines, chapter changes, emphasis, or short instructional statements where textual rhythm matters.
    tools: [motion, gsap]
    demo: split-text-reveal
    primitives: [text-segmentation, stagger, clipping, reading-order]
    implementation_note: Segment at meaningful phrase boundaries and preserve legibility when reduced motion is requested.
    status: seed
    references:
      - https://motion.dev/examples?category=text

  - id: depth-parallax
    name: Depth parallax
    domain: rendering
    summary: Move visual layers at different rates so depth emerges from relative motion.
    use_when: Hero scenes, spatial diagrams, galleries, or teaching visuals where near/far relationships should be felt immediately.
    tools: [motion, gsap, threejs]
    demo: depth-parallax
    primitives: [layer-depth, viewpoint, relative-motion, foreground-background]
    implementation_note: Tie movement amplitude to semantic depth; random layer speeds quickly become decorative noise.
    status: seed

  - id: particle-attractor
    name: Particle attractor
    domain: rendering
    summary: Let many small elements reveal an invisible field by moving toward a controllable attractor.
    use_when: Field visualizations, generative transitions, particle interfaces, or effects where force should be inferred from motion.
    tools: [pixijs, p5js]
    demo: particle-attractor
    primitives: [particles, attractor, velocity, force-field]
    implementation_note: Keep force rules explicit and bounded; particle count should scale with the renderer rather than the desired visual density alone.
    status: seed

  - id: noise-threshold-wipe
    name: Noise-threshold wipe
    domain: rendering
    summary: Reveal the next state through a spatial noise threshold rather than a clean geometric edge.
    use_when: Organic scene transitions, shader reveals, dissolves, x-ray effects, or visual changes that need irregular boundaries.
    tools: [threejs, gsap]
    demo: noise-threshold-wipe
    primitives: [noise-field, threshold, reveal-progress, mask]
    implementation_note: Treat the noise field as stable data and animate the threshold; changing both creates incoherent flicker.
    status: seed
    references:
      - https://tympanus.net/codrops/2026/04/28/more-than-a-portfolio-building-a-scroll-driven-3d-world-with-something-to-say/

  - id: explode-assemble
    name: Explode / assemble
    domain: spatial-3d
    summary: Separate a system into identifiable parts, then bring the same parts back into one whole.
    use_when: Exploded diagrams, mechanical assemblies, molecular structures, layered systems, or product construction stories.
    tools: [threejs, theatrejs]
    demo: explode-assemble
    primitives: [part-identity, local-offset, assembly-progress, correspondence]
    implementation_note: Every part must keep identity across the transition; an exploded view is explanatory only if users can map pieces back to the whole.
    status: seed

  - id: anchored-callout
    name: Anchored callout
    domain: spatial-3d
    summary: Keep a label attached to the same feature while the object or camera moves.
    use_when: 3D explanations, product anatomy, molecular viewers, maps, or scenes where labels must survive motion without drifting.
    tools: [threejs, react-three-fiber]
    demo: anchored-callout
    primitives: [world-anchor, screen-label, leader-line, projection]
    implementation_note: Derive screen position from the feature anchor every frame and handle occlusion or label collisions separately from the 3D scene.
    status: seed

  - id: focus-context
    name: Focus + context
    domain: graphs
    summary: Emphasize one node and its neighborhood without erasing the rest of the network.
    use_when: Knowledge graphs, concept networks, dependency maps, or graph exploration.
    tools: [antv-g6, cytoscapejs]
    demo: focus-context
    primitives: [focus-node, neighbors, faded-context, edge-emphasis]
    implementation_note: Preserve enough context for orientation; de-emphasize unrelated nodes instead of removing them.
    status: seed

  - id: semantic-zoom
    name: Semantic zoom
    domain: graphs
    summary: Reveal more meaning as the user zooms in instead of merely scaling pixels.
    use_when: Large graphs, maps, concept spaces, timelines, or dense spatial canvases.
    tools: [antv-g6]
    demo: semantic-zoom
    primitives: [zoom-level, label-threshold, detail-threshold, aggregation]
    implementation_note: Define semantic thresholds explicitly so added detail corresponds to a real information level.
    status: seed

  - id: graph-relayout
    name: Graph re-layout continuity
    domain: graphs
    summary: Change the graph layout while keeping node identity visually continuous.
    use_when: Switching between hierarchy, network, timeline, or grouped views without making users relearn the graph.
    tools: [antv-g6, cytoscapejs]
    demo: graph-relayout
    primitives: [stable-node-id, old-layout, new-layout, interpolated-position]
    implementation_note: Animate the same node objects between positions; replacing the graph with a fresh render destroys correspondence.
    status: seed

  - id: canvas-focus-lens
    name: Canvas focus lens
    domain: graphs
    summary: Move a local lens across a dense canvas to reveal detail without committing to a full zoom.
    use_when: Infinite canvases, dense diagrams, maps, network inspection, or overview-detail interfaces.
    tools: [tldraw, konva]
    demo: canvas-focus-lens
    primitives: [overview, lens, local-detail, pointer-position]
    implementation_note: Keep the overview stable under the lens; the local layer should add information rather than merely magnify pixels.
    status: seed
