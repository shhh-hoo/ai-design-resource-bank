  - id: leaflet
    name: Leaflet
    kind: map-library
    tier: secondary
    domains: [maps, geospatial]
    capabilities: [2d-map, markers, popups, tile-layers, plugins]
    homepage: https://leafletjs.com/
    docs: https://leafletjs.com/reference.html
    examples: https://leafletjs.com/examples.html
    ecosystem: [JavaScript, DOM, Canvas, SVG]
    license: BSD-2-Clause
    use_when: Lightweight conventional 2D maps and a broad plugin ecosystem are enough.
    avoid_when: WebGL vector styling, globe, heavy 3D, or very large GPU layers are required.
    agent_notes: Still useful for simple map products; MapLibre is often the stronger modern default for vector-map work.
    tags: [map, lightweight, 2d]

  - id: globe-gl
    name: Globe.GL
    kind: visualization-component
    tier: specialized
    domains: [geospatial, 3d, data-visualization]
    capabilities: [interactive-globe, arcs, points, polygons, labels, custom-objects]
    homepage: https://globe.gl/
    docs: https://github.com/vasturiano/globe.gl
