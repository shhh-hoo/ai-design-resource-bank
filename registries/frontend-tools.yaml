  - id: cesiumjs
    name: CesiumJS
    kind: geospatial-engine
    tier: core
    domains: [maps, geospatial, 3d, earth-science]
    capabilities: [3d-globe, terrain, 3d-tiles, gltf, czml, time-dynamic-data]
    homepage: https://cesium.com/platform/cesiumjs/
    docs: https://cesium.com/learn/cesiumjs/ref-doc/
    examples: https://cesium.com/learn/cesiumjs-sandcastle/
    ecosystem: [JavaScript, WebGL]
    license: Apache-2.0-core
    rights_note: CesiumJS core is open source; hosted Cesium ion services/assets have separate terms.
    use_when: Globe-scale 3D geospatial scenes, terrain, 3D Tiles, satellites, trajectories, or time-dynamic Earth data are required.
    avoid_when: A conventional 2D vector map is sufficient.
    agent_notes: Prefer over raw Three.js when geospatial coordinates/terrain/tiles are the hard problem.
    tags: [map, globe, 3d, geospatial]

  - id: deckgl
    name: deck.gl
    kind: geospatial-visualization-library
    tier: specialized
    domains: [maps, geospatial, data-visualization]
    capabilities: [large-data-layers, gpu-aggregation, map-overlays, arcs, trips, point-clouds]
    homepage: https://deck.gl/
    docs: https://deck.gl/docs
    examples: https://deck.gl/examples
    ecosystem: [JavaScript, WebGL, React]
    license: MIT
    use_when: Large geospatial datasets and GPU-accelerated visual layers sit on top of maps.
    avoid_when: The problem is primarily basemap navigation rather than data-layer rendering.
