  - id: maplibre-gl-js
    name: MapLibre GL JS
    kind: map-engine
    tier: core
    domains: [maps, geospatial]
    capabilities: [vector-tiles, webgl-map, globe, camera, layers, styling, interaction]
    homepage: https://maplibre.org/maplibre-gl-js/docs/
    docs: https://maplibre.org/maplibre-gl-js/docs/
    examples: https://maplibre.org/maplibre-gl-js/docs/examples/
