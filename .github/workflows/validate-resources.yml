name: Validate resources

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema

      - name: Validate resource packages
        run: python scripts/validate_resources.py

      - name: Validate capability registries
        run: python scripts/validate_registries.py

      - name: Validate mechanism registry
        run: python scripts/validate_mechanisms.py

      - name: Validate capability board contract
        run: python scripts/validate_board.py

      - name: Validate capability board JavaScript
        run: node --check web/board.js
