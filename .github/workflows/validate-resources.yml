name: Validate Knowledge Atlas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
          npm ci --no-audit --no-fund
      - name: Validate authoritative Core and compatibility inputs
        run: |
          python scripts/validate_atlas.py
          python scripts/validate_resources.py
          python scripts/validate_registries.py
          python scripts/validate_mechanisms.py
          python scripts/validate_subject_atlas.py
          python scripts/validate_grammar_mechanisms.py
      - name: Detect generated drift and create SQLite FTS
        run: python scripts/build_catalog.py --check
      - name: Exercise retrieval, locking and chemical models
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/models.test.mjs
          node --check app/atlas.js
          node --check app/live.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser navigation, mobile, selection and startup budget
        run: npm run test:browser
      - name: Validate publish artifact
        run: python scripts/build_site.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-evidence
          include-hidden-files: true
          path: .browser-test/
  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
      - name: Validate Windows checkout, catalog reproducibility and retrieval
        run: |
          python scripts/validate_atlas.py
          python scripts/validate_resources.py
          python scripts/build_catalog.py --check
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_site.py
