name: One-shot framework open sync

on:
  push:
    branches:
      - feat/framework-backed-demos

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/framework-backed-demos
      - name: Sync framework demo when drawer opens
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/mechanism-workbench.js')
          s = p.read_text()
          old = '''    new MutationObserver(() => {\n      if (!drawer.classList.contains("is-open")) cleanupDemo();\n    }).observe(drawer, { attributes: true, attributeFilter: ["class"] });\n'''
          new = '''    new MutationObserver(() => {\n      if (drawer.classList.contains("is-open")) syncDrawerDemo(content, drawer);\n      else cleanupDemo();\n    }).observe(drawer, { attributes: true, attributeFilter: ["class"] });\n'''
          if old not in s:
              raise SystemExit('drawer class observer patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check web/mechanism-workbench.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/mechanism-workbench.js
          git commit -m "Sync framework demo when drawer opens"
          git push origin HEAD:feat/framework-backed-demos
