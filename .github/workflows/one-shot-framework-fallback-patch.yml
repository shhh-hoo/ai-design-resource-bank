name: One-shot framework fallback patch

on:
  push:
    branches:
      - feat/framework-backed-demos

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/framework-backed-demos
      - name: Harden lazy renderer fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/mechanism-workbench.js')
          s = p.read_text()
          old = '''        .catch((error) => {\n          console.error(`Framework demo failed (${exportName})`, error);\n          if (disposed) return;\n          if (typeof fallback === "function") cleanup = fallback(host) || (() => {});\n          else host.innerHTML = `<p class="demo-loading">Renderer unavailable.</p>`;\n        });\n'''
          new = '''        .catch((error) => {\n          console.error(`Framework demo failed (${exportName})`, error);\n          if (disposed || !host.isConnected) return;\n          host.replaceChildren();\n          try {\n            if (typeof fallback === "function") cleanup = fallback(host) || (() => {});\n            else host.innerHTML = `<p class="demo-loading" data-renderer-fallback>Renderer unavailable on this browser.</p>`;\n          } catch (fallbackError) {\n            console.error(`Framework fallback failed (${exportName})`, fallbackError);\n            host.innerHTML = `<p class="demo-loading" data-renderer-fallback>Renderer unavailable on this browser.</p>`;\n          }\n        });\n'''
          if old not in s:
              raise SystemExit('fallback patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check web/mechanism-workbench.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/mechanism-workbench.js
          git commit -m "Harden framework demo fallback"
          git push origin HEAD:feat/framework-backed-demos
