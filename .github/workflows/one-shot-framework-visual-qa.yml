name: One-shot framework visual QA

on:
  push:
    branches:
      - feat/framework-backed-demos

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/framework-backed-demos
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build preview
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium firefox
          python -m pip install --disable-pip-version-check --quiet pyyaml
          mkdir -p _preview/data
          python scripts/build_board_data.py --output _preview/data/board.json
          cp index.html _preview/index.html
          cp catalog.yaml _preview/catalog.yaml
          cp -R web _preview/web
          cp -R registries _preview/registries
          BOARD_FRAMEWORK_OUTDIR=_preview/web/framework npm run build:framework-demos
      - name: Browser smoke and screenshots
        run: |
          python -m http.server 4173 --directory _preview >/tmp/resource-bank-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          mkdir -p qa-screenshots
          cat > .framework-qa.mjs <<'JS'
          import { chromium, firefox } from 'playwright';

          const cases = [
            ['camera-dolly', 'three', '55'],
            ['orbital-overlap', 'three', '82'],
            ['explode-assemble', 'three', '62'],
            ['anchored-callout', 'three', '68'],
            ['graph-relayout', 'd3', null],
          ];
          const base = 'http://127.0.0.1:4173/';

          const isExpectedFirefoxWebGLBlock = (errors) => errors.length > 0 && errors.every((message) =>
            /WebGL context could not be created|Error creating WebGL context|Framework demo failed/.test(message)
          ) && errors.some((message) => /AllowWebgl2:false/.test(message));

          async function moveControl(page, value) {
            if (value) {
              const range = page.locator('.drawer .demo-stage input[type="range"]');
              if (await range.count()) {
                await range.evaluate((element, nextValue) => {
                  element.value = nextValue;
                  element.dispatchEvent(new Event('input', { bubbles: true }));
                }, value);
              }
            } else {
              const button = page.locator('.drawer .demo-stage button');
              if (await button.count()) await button.click();
            }
          }

          async function assertSettledFallback(page, name, id) {
            await page.waitForTimeout(500);
            const state = await page.locator('.drawer .demo-stage').evaluate((host) => ({
              text: host.textContent || '',
              hasSvg: Boolean(host.querySelector('svg')),
              hasFallbackMessage: Boolean(host.querySelector('[data-renderer-fallback]')),
            }));
            if (/Loading renderer/i.test(state.text)) throw new Error(`${name}/${id}: renderer fallback never settled`);
            if (!state.hasSvg && !state.hasFallbackMessage) throw new Error(`${name}/${id}: no usable fallback state`);
          }

          async function runBrowser(browserType, name, screenshots) {
            const browser = await browserType.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const errors = [];
            const failed = [];
            page.on('console', (msg) => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('pageerror', (error) => errors.push(error.message));
            page.on('requestfailed', (request) => failed.push(`${request.url()} :: ${request.failure()?.errorText}`));

            for (const [id, runtime, value] of cases) {
              errors.length = 0;
              failed.length = 0;
              await page.goto(`${base}#mechanism:${id}`, { waitUntil: 'networkidle' });
              await page.waitForSelector('.drawer.is-open');

              let frameworkActive = true;
              try {
                await page.waitForSelector('.framework-badge', { timeout: runtime === 'three' && name === 'firefox' ? 2500 : 10000 });
              } catch (error) {
                if (runtime === 'three' && name === 'firefox' && isExpectedFirefoxWebGLBlock(errors)) {
                  frameworkActive = false;
                  const directImport = await page.evaluate(async () => {
                    try {
                      const module = await import('./web/framework/three-demos.js');
                      return { ok: true, exports: Object.keys(module) };
                    } catch (e) {
                      return { ok: false, error: String(e?.stack || e) };
                    }
                  });
                  if (!directImport.ok) throw new Error(`Firefox Three bundle import failed: ${directImport.error}`);
                  await assertSettledFallback(page, name, id);
                } else {
                  throw error;
                }
              }

              if (frameworkActive) {
                const badge = (await page.locator('.framework-badge').innerText()).toLowerCase();
                if (!badge.includes(runtime === 'three' ? 'three' : 'd3')) throw new Error(`${name}/${id}: wrong runtime badge ${badge}`);
              }

              await moveControl(page, value);
              await page.waitForTimeout(250);

              if (runtime === 'three' && frameworkActive) {
                const canvas = page.locator('.drawer .framework-stage canvas');
                const box = await canvas.boundingBox();
                if (!box || box.width < 250 || box.height < 180) throw new Error(`${name}/${id}: invalid WebGL canvas size`);
              }
              if (runtime === 'd3' && !frameworkActive) throw new Error(`${name}/${id}: D3 framework path must not fall back`);
              if (failed.length) throw new Error(`${name}/${id} request failures:\n${failed.join('\n')}`);
              if (errors.length && !(runtime === 'three' && name === 'firefox' && !frameworkActive && isExpectedFirefoxWebGLBlock(errors))) {
                throw new Error(`${name}/${id} console errors:\n${errors.join('\n')}`);
              }

              await page.evaluate(() => new Promise((resolve) => requestAnimationFrame(() => resolve(true))));
              if (screenshots) await page.screenshot({ path: `qa-screenshots/${id}.png` });
            }

            if (name === 'firefox') {
              await page.goto(base, { waitUntil: 'networkidle' });
              for (let i = 0; i < 8; i += 1) {
                await page.evaluate((index) => {
                  history.pushState({}, '', `#mechanism:${index % 2 ? 'camera-dolly' : 'graph-relayout'}`);
                  window.dispatchEvent(new PopStateEvent('popstate'));
                }, i);
                await page.waitForSelector('.drawer.is-open');
                await page.keyboard.press('Escape');
                await page.waitForFunction(() => !document.querySelector('.drawer')?.classList.contains('is-open'));
              }
              const responsive = await page.evaluate(() => new Promise((resolve) => setTimeout(() => resolve('ok'), 50)));
              if (responsive !== 'ok') throw new Error('Firefox drawer responsiveness regression');
            }

            await browser.close();
          }

          await runBrowser(chromium, 'chromium', true);
          await runBrowser(firefox, 'firefox', false);
          JS
          node .framework-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-demo-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: error
