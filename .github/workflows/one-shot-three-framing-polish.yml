name: One-shot Three framing polish

on:
  push:
    branches:
      - feat/framework-backed-demos

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/framework-backed-demos
      - name: Improve Three demo framing and contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/framework/three-demos.js')
          s = p.read_text()
          replacements = [
            ('const geometry = new THREE.SphereGeometry(0.72, 32, 20);', 'const geometry = new THREE.SphereGeometry(0.78, 32, 20);', 1),
            ('mesh.scale.set(1.25, 0.64, 0.64);', 'mesh.scale.set(1.42, 0.72, 0.72);', 1),
            ('new THREE.SphereGeometry(0.16, 24, 16)', 'new THREE.SphereGeometry(0.19, 24, 16)', 1),
            ('const left = orbitalLobe(INK, 0.28);', 'const left = orbitalLobe(0x4a4a46, 0.72);', 1),
            ('const right = orbitalLobe(0xffffff, 0.5);', 'const right = orbitalLobe(0xd8d8d2, 0.78);', 1),
            ('pair.rotation.y = 0.18;', 'pair.rotation.y = 0.38;', 1),
            ('new THREE.SphereGeometry(0.72, 32, 20),\n    new THREE.MeshPhysicalMaterial({\n      color: ACCENT,', 'new THREE.SphereGeometry(0.84, 32, 20),\n    new THREE.MeshPhysicalMaterial({\n      color: ACCENT,', 1),
            ('opacity: 0.12,\n      depthWrite: false,\n      roughness: 0.45,', 'opacity: 0.18,\n      depthWrite: false,\n      roughness: 0.5,', 1),
            ('overlap.scale.set(0.4, 0.58, 0.58);', 'overlap.scale.set(0.45, 0.72, 0.72);', 1),
            ('ctx.camera.position.set(0, 1.25, 6.8);', 'ctx.camera.position.set(0, 0.8, 5.15);', 1),
            ('const separation = 4.1 - p * 2.15;', 'const separation = 4.2 - p * 2.65;', 1),
            ('const overlapStrength = Math.max(0, Math.min(1, (3.15 - separation) / 1.2));', 'const overlapStrength = Math.max(0, Math.min(1, (3.4 - separation) / 1.5));', 1),
            ('overlap.scale.x = 0.12 + overlapStrength * 0.95;', 'overlap.scale.x = 0.18 + overlapStrength * 1.18;', 1),
            ('overlap.material.opacity = 0.04 + overlapStrength * 0.28;', 'overlap.material.opacity = 0.08 + overlapStrength * 0.32;', 1),
            ('assembly.rotation.set(-0.22, 0.48, 0.04);', 'assembly.rotation.set(-0.25, 0.58, 0.04);', 1),
            ('[-0.75, 0.42, 0], [0, 0.42, 0], [0.75, 0.42, 0],\n    [-0.75, -0.38, 0], [0, -0.38, 0], [0.75, -0.38, 0],', '[-0.88, 0.48, 0], [0, 0.48, 0], [0.88, 0.48, 0],\n    [-0.88, -0.44, 0], [0, -0.44, 0], [0.88, -0.44, 0],', 1),
            ('[-2.0, 1.2, 0.8], [0, 1.75, -0.45], [2.15, 1.05, 0.55],\n    [-2.1, -1.0, -0.55], [0, -1.65, 0.75], [2.0, -1.08, -0.72],', '[-2.2, 1.35, 1.0], [0, 1.9, -0.65], [2.25, 1.18, 0.75],\n    [-2.25, -1.12, -0.72], [0, -1.82, 0.95], [2.2, -1.2, -0.9],', 1),
            ('outlinedBox(0.68, 0.68, 0.68, index === 2 ? ACCENT : 0xffffff)', 'outlinedBox(0.82, 0.82, 0.82, index === 2 ? ACCENT : 0xffffff)', 1),
            ('ctx.camera.position.set(0.2, 1.45, 6.8);', 'ctx.camera.position.set(0.15, 1.2, 5.55);', 1),
            ('const object = outlinedBox(2.0, 1.45, 1.25, 0xffffff);', 'const object = outlinedBox(2.5, 1.7, 1.5, 0xffffff);', 1),
            ('const localAnchor = new THREE.Vector3(1.0, 0.72, 0.62);', 'const localAnchor = new THREE.Vector3(1.25, 0.85, 0.75);', 1),
            ('ctx.camera.position.set(3.4, 2.4, 5.3);', 'ctx.camera.position.set(3.0, 2.0, 4.3);', 1),
          ]
          for old, new, count in replacements:
            if s.count(old) < count:
              raise SystemExit(f'patch target not found: {old[:90]}')
            s = s.replace(old, new, count)
          p.write_text(s)
          PY
          node --check web/framework/three-demos.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/framework/three-demos.js
          git commit -m "Improve Three demo framing and contrast"
          git push origin HEAD:feat/framework-backed-demos
