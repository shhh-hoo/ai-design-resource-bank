name: Regenerate catalog on preservation branch
on:
  push:
    branches: [fix/restore-resource-bank-examples]
    paths:
      - 'knowledge/**'
      - 'subjects/**'
      - 'resources/**'
      - 'registries/**'
      - 'schemas/**'
      - 'scripts/atlas_core.py'
      - 'scripts/build_catalog.py'
      - '.github/workflows/regenerate-catalog.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-resource-bank-examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical projections
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
          python scripts/build_catalog.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog catalog.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: regenerate preserved examples'
            git push
          fi
