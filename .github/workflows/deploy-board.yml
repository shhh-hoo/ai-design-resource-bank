name: Deploy Knowledge Atlas
on:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', 'knowledge/**', 'subjects/**', 'resources/**', 'registries/**', 'catalog/**', 'catalog.yaml', 'schemas/**', 'scripts/**', '.github/workflows/deploy-board.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and stage generated Atlas
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml jsonschema
          python scripts/validate_atlas.py
          python scripts/validate_resources.py
          python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
