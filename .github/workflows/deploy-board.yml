name: Deploy capability board

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - web/**
      - registries/**
      - catalog.yaml
      - package.json
      - package-lock.json
      - scripts/build_board_data.py
      - scripts/build_subject_atlas_data.py
      - scripts/build_framework_demos.mjs
      - .github/workflows/deploy-board.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install framework build dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile runtime data
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml
          mkdir -p _site/data
          python scripts/build_board_data.py --output _site/data/board.json
          python scripts/build_subject_atlas_data.py --output _site/data/subject-atlas.json

      - name: Build static board artifact
        run: |
          cp index.html _site/index.html
          cp catalog.yaml _site/catalog.yaml
          cp -R web _site/web
          cp -R registries _site/registries
          touch _site/.nojekyll

      - name: Bundle lazy framework demos
        env:
          BOARD_FRAMEWORK_OUTDIR: _site/web/framework
        run: npm run build:framework-demos

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
