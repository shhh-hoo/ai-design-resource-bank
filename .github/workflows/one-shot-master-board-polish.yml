name: Apply master board polish
on:
  push:
    branches: [feat/master-decision-board]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/master-decision-board
      - run: python scripts/_polish_master_board.py
      - run: |
          node --check web/board.js
          node --check web/decision-board.js
          python -m py_compile scripts/validate_board.py scripts/validate_decision_board.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/board.js web/board.css web/decision-board.css web/decision-board.js scripts/validate_board.py scripts/validate_decision_board.py
          git commit -m "Polish and lazy-load master decision board"
          git push origin HEAD:feat/master-decision-board
