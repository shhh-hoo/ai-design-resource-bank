name: Apply master board patch
on:
  push:
    branches: [feat/master-decision-board]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/master-decision-board
      - run: python scripts/_patch_master_board.py
      - run: |
          node --check web/board.js
          node --check web/decision-board.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/board.js web/board.css
          git commit -m "Wire master decision board"
          git push origin HEAD:feat/master-decision-board
