<!doctype html>
<meta charset="utf-8">
<title>Archive as interface demo</title>
<style>
  body{font:14px/1.35 system-ui;margin:0;padding:32px;max-width:980px}
  input{width:100%;box-sizing:border-box;padding:10px 0;border:0;border-bottom:1px solid;margin-bottom:28px}
  .archive-group{display:grid;grid-template-columns:100px 1fr;border-top:1px solid}
  .archive-group h2{font-size:12px;font-weight:500;margin:10px 0}
  .archive-row{grid-column:2;display:grid;grid-template-columns:2fr 1fr 2fr;gap:16px;padding:9px 0;border-top:1px solid #ddd;color:inherit;text-decoration:none}
  .archive-kind,.archive-note{color:#666}
  @media(max-width:640px){.archive-group{grid-template-columns:1fr}.archive-row{grid-column:1;grid-template-columns:1fr}.archive-kind,.archive-note{font-size:12px}}
</style>
<input id="q" placeholder="Filter the visible corpus">
<main id="archive"></main>
<script type="module">
  import { filterArchive, renderArchive } from "./archive-index.js";
  const records=[
    {title:"Field Notes",year:2026,kind:"Essay",note:"Observation and method"},
    {title:"Light Study",year:2026,kind:"Study",note:"Spatial light sequence"},
    {title:"Index Prototype",year:2025,kind:"Prototype",note:"Dense corpus navigation"},
    {title:"Motion Grammar",year:2024,kind:"System",note:"Reusable motion rules"}
  ];
  const root=document.querySelector("#archive"), input=document.querySelector("#q");
  const update=()=>renderArchive(root,filterArchive(records,input.value));
  input.addEventListener("input",update); update();
</script>
