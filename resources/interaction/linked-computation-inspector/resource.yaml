  summary: A single selected coordinate derives its local inputs, operation products and output together so the user can trace exactly how one result was produced.
  primitives: [selection-key, local-input, operation, intermediate-products, derived-output]
  states: [idle, selected]
  parameters: [row, column, kernel, padding]
  failure_modes: [Showing output without source values, Letting input and output selections drift apart, Hiding edge padding rules, Displaying intermediate values from a different model state]
