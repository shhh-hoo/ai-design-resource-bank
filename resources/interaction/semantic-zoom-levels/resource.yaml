selection_reason: Make zoom change information meaning and detail level rather than only scaling pixels, while avoiding threshold flicker.
mechanism:
  summary: Define named semantic levels with explicit scale thresholds and optional hysteresis; select the active information level independently from geometric rendering.
  primitives: [scale, semantic-level, threshold, visible-fields, hysteresis]
  states: [overview, context, detail]
  parameters: [level-thresholds, hysteresis, visible-fields]
  failure_modes: [Adding every label at every scale, Coupling semantic level to raw pixel size only, Flickering at thresholds, Changing identity while changing detail]
