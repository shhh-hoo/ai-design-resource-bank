<!doctype html>
<meta charset="utf-8">
<title>Semantic zoom levels demo</title>
<style>
  body{font:15px/1.4 system-ui;max-width:720px;margin:40px auto;padding:0 20px}
  input{width:100%}.scene{margin-top:24px;border:1px solid;padding:28px;min-height:150px}.muted{color:#777}
</style>
<label>Scale <input id="scale" type="range" min="0.5" max="4" step="0.01" value="0.8"></label>
<p>Active level: <strong id="level"></strong></p>
<div class="scene"><h2 id="title"></h2><p id="context" class="muted"></p><p id="detail"></p></div>
<script type="module">
  import { createSemanticZoom } from "./semantic-zoom.js";
  const levels=[
    {id:"overview",minScale:0,fields:["title"]},
    {id:"context",minScale:1.5,fields:["title","context"]},
    {id:"detail",minScale:2.8,fields:["title","context","detail"]}
  ];
  const zoom=createSemanticZoom(levels,{hysteresis:0.08});
  const input=document.querySelector("#scale");
  const values={title:"Object 17",context:"Cluster / Region A",detail:"Detailed metadata appears only at the closest level."};
  const update=()=>{
    const level=zoom.select(Number(input.value));
    document.querySelector("#level").textContent=level.id;
    for(const key of ["title","context","detail"]) document.querySelector("#"+key).textContent=level.fields.includes(key)?values[key]:"";
  };
  input.addEventListener("input",update);update();
</script>
